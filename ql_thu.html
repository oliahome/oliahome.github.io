<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Quản lý · Olia Home</title><link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f5d3_fe0f/72.png">
<base target="_top">
<script>(function(){try{var m=localStorage.getItem("olia_gd")||"auto";if(m==="toi"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("toi")}catch(e){}})()</script>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Sacramento&display=swap">
<style>
/* Trang quản lý Olia: thanh trên + 3 tab (Timeline, Chờ cọc, Dọn phòng). Timeline = lưới phòng × ngày,
   thanh đặt phòng chạy từ giữa ngày nhận tới giữa ngày trả như sổ khách sạn. */
:root{
  --bg:#f6f4f0; --card:#fff; --fg:#222; --muted:#6a6a6a; --line:#e6e1d8; --soft:#f1ede6;
  --sun:#e9a23b; --sun2:#d9772b; --keep:#f3b54a; --keep-bg:#fff3dc; --book:#3c7dd9; --done:#4a4f55;
  --ok:#2f7d4f; --ok-bg:#e7f3ec; --bad:#c13515; --bad-bg:#fdeceb; --today:#fff7e6;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo img{width:40px;height:40px;border-radius:50%;mix-blend-mode:multiply}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:99px;padding:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;border-radius:99px;padding:7px 14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px;text-align:center}
main{padding:16px max(16px,env(safe-area-inset-left,0px)) 80px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:linear-gradient(90deg,var(--sun2),var(--sun));border-color:transparent;color:#fff}
.btn.dark{background:var(--fg);color:#fff;border-color:var(--fg)}
.btn.bad{color:var(--bad);border-color:#f0c6bf}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}.sm{font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* timeline */
.tl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;cursor:grab}
.tl.dang-keo{cursor:grabbing;user-select:none}
.tl.dang-keo .bk{pointer-events:none}
.tl-c.m1{border-left:2px solid #b0895a}.tl-h.m1{position:relative}.tl-thang{position:absolute;left:-1px;top:0;font-style:normal;font-size:9.5px;font-weight:700;line-height:1;padding:2px 5px;border-radius:0 0 6px 0;background:#b0895a;color:#fff;white-space:nowrap}
#tlThang{min-width:110px}
.tl-g{display:grid;min-width:max-content}
.tl-c{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:68px;position:relative}
.tl-h{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--card);z-index:3}
.tl-h b{color:var(--fg);font-size:14px}
.tl-h.we{background:#fdebd3;color:#b5651d}
.tl-h.we b{color:#b5651d}
.tl-h.we::after{content:"cuối tuần";font-size:9.5px;font-weight:700;letter-spacing:.03em;color:#c27a2c;text-transform:uppercase;line-height:1}
.tl-c.cuoi{background-image:linear-gradient(rgba(240,170,90,.16),rgba(240,170,90,.16))}
.tl-c.td{background-image:linear-gradient(rgba(255,214,120,.28),rgba(255,214,120,.28))}
.tl-r span{display:flex;align-items:center;gap:6px}
.cham{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tl-h.td{background:var(--today)}
.tl-h.td b{color:var(--sun2)}
.tl-r{position:sticky;left:0;z-index:4;background:var(--card);display:flex;flex-direction:column;justify-content:center;padding:0 10px;font-weight:600;border-right:1px solid var(--line)}
.tl-r small{font-weight:500;font-size:11.5px}
.lane{position:relative;height:68px;pointer-events:none;z-index:2}
.bk{position:absolute;top:6px;height:40px;border-radius:9px;padding:3px 9px;display:flex;flex-direction:column;justify-content:center;
  font-size:12px;line-height:1.25;color:#fff;overflow:hidden;white-space:nowrap;pointer-events:auto;cursor:pointer;border:0;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bk b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.bk.Keep{background:var(--keep-bg);color:#7a4b00;border:1.5px dashed var(--keep)}
.bk.Book{background:var(--book)}
.bk.Done{background:var(--done)}
.bk.cut-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bk.cut-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bk:hover{filter:brightness(1.06);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.don{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:3;border:0;background:none;padding:0;font-size:16px;line-height:1;pointer-events:auto}
.don:hover{transform:translateX(-50%) scale(1.15)}
.tip{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;width:300px;max-width:calc(100vw - 24px);pointer-events:none;font-size:13px}
.tip .row,.kv{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.tip .row span:first-child,.kv span:first-child{color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:700}
.pill.Keep{background:var(--keep-bg);color:#7a4b00}.pill.Book{background:#e3edfb;color:#1f58a8}.pill.Done{background:#e6e7e9;color:#33373b}

/* bảng chi tiết */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.dr{background:var(--card);width:min(440px,100%);height:100%;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 20px;display:flex;flex-direction:column;gap:16px}
@media (max-width:700px){.drawer{align-items:flex-end}.dr{height:auto;max-height:92%;border-radius:18px 18px 0 0;width:100%}}
.dr h2{margin:0;font-size:20px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-size:18px}
.sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:8px 0;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.Keep{background:var(--keep);color:#4a2c00}.seg button.on.Book{background:var(--book);color:#fff}.seg button.on.Done{background:var(--done);color:#fff}
.tog{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-weight:600;text-align:left}
.tog.ok{background:var(--ok-bg);border-color:#bfe0cb;color:var(--ok)}
.tog.can{background:var(--bad-bg);border-color:#f0c6bf;color:var(--bad)}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;color:var(--fg);background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ok-t{color:var(--ok);font-weight:600}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--card);border-radius:16px;width:min(820px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.mbox .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mbox .mb{overflow:auto;background:#fafafa}

/* chờ cọc & dọn phòng */
.tra-thue{margin-bottom:12px}.tra-thue .loc{display:block;width:100%;max-width:none;height:42px;min-height:0;flex:none;margin:8px 0;text-align:left;cursor:text}.chk-cd{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}.chk-cd input{width:16px;height:16px;accent-color:#c46a12}#thTimKQ .cards{margin:6px 0}.ds-thue{display:flex;flex-direction:column;gap:4px}.dt{display:grid;grid-template-columns:minmax(150px,1.2fr) 86px minmax(150px,1fr) minmax(130px,1fr) 104px 150px;gap:10px;align-items:center;text-align:left;padding:8px 12px;border:1px solid var(--line,#e8e2d8);border-radius:10px;background:var(--card);font:inherit;font-size:13px;cursor:pointer}.dt:hover{border-color:#e08a2c}.dt.xong{opacity:.6}.dt-th{white-space:nowrap;text-align:right}.dt .num{text-align:right}.dt .ma{justify-self:start}.dt-th i{font-style:normal;color:#c46a12;font-weight:600}@media(max-width:900px){.dt{grid-template-columns:minmax(0,1fr) auto auto;gap:3px 10px}.dt .muted{grid-column:1/-1;font-size:12.5px}.dt b{grid-column:1/3}.dt .ma{grid-row:1;grid-column:3;justify-self:end}.dt .num{text-align:left}.dt .dt-th{grid-column:2/4}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.big{font-size:16px;padding:14px;border-radius:12px;justify-content:center}
.day-h{font-size:16px;font-weight:700;margin:18px 0 10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:12.5px}.kpi b{font-size:20px}
.kpi.warn{border-color:#f0c6bf;background:var(--bad-bg)}.kpi.warn b{color:var(--bad)}
.cot{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:170px;align-items:end}
.cot-i{border:0;background:none;padding:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.cot-b{width:70%;max-width:38px;background:#e8d7bd;border-radius:6px 6px 0 0;display:block}
.cot-i.on .cot-b{background:linear-gradient(180deg,var(--sun),var(--sun2))}
.cot-i:hover .cot-b{filter:brightness(.92)}
.cot-v{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cot-t{font-size:12px;font-weight:600}
.cot-i.on .cot-t{color:var(--sun2)}
table.so{width:100%;border-collapse:collapse;min-width:620px}
table.so th,table.so td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
table.so th{font-size:12px;color:var(--muted);font-weight:600;background:#faf8f4}
table.so .r{text-align:right}
table.so tfoot td{border-bottom:0;background:#faf8f4}
.tl-c[data-act="themO"]{cursor:cell}
.tl-c[data-act="themO"]:hover{box-shadow:inset 0 0 0 2px rgba(217,119,43,.35)}
.td-f{display:flex;flex-direction:column;gap:12px}
.td-xem{background:#fafaf7}
.tim{position:relative;flex:1 1 260px;max-width:420px}
.tim input{width:100%;border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:14px;background:var(--soft)}
.tim input:focus{background:var(--card);outline:2px solid var(--sun);border-color:transparent}
.tim-kq{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.15);max-height:60vh;overflow:auto}
.tim-i{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px}
.tim-i:hover{background:var(--soft)}
mark{background:#ffe08a;border-radius:3px;padding:0 1px}
.loc{flex:1 1 260px;font-weight:400;max-width:380px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.chip.on .muted{color:#ddd}
table.so tr.so-ngay td{background:#f4efe6;font-weight:600;font-size:13px;border-bottom:1px solid #e3d9c8}
table.so tr.khac td{background:#fff8ec}
table.so tr:hover td{background:#fbf6ee}
.o-khac{display:inline-block;width:12px;height:12px;border-radius:3px;background:#fff1d6;border:1px solid #f0d9ae;vertical-align:-1px;margin-right:4px}
.ma{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--soft);border-radius:5px;padding:1px 6px}
/* ---- chống tràn chữ / ô ---- */
html,body{overflow-x:clip}
.tl-r{min-width:0;overflow:hidden}
.tl-r small em{font-style:normal}
.tl-r span,.tl-r small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.tl-r span{display:flex}
.bk span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bk b,.bk span{display:block}
.fld input,.fld select,.fld textarea{width:100%;min-width:0}
.row2>*{min-width:0}
.kv>span:last-child,.kv>b,.kv>a{text-align:right;overflow-wrap:anywhere;min-width:0}
.card h3 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tim-d{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tim-i .muted{overflow-wrap:anywhere}
table.so td{overflow-wrap:anywhere}
.m-only{display:none}
.mbox .mh .acts input{min-width:0;flex:1 1 180px}
@media (max-width:700px){
  .top-in{gap:8px;padding-top:8px;padding-bottom:8px}
  .logo span{display:none}
  .logo img{width:34px;height:34px}
  .tim{order:3;flex:1 1 100%;max-width:none}
  .tabs{order:2;flex:1 1 100%;margin-left:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
  .tabs button{padding:6px 2px;font-size:11px;text-align:center;line-height:1.2;white-space:normal}
  .logo{order:1}
  .tl-r small em{display:none}
  main{padding:10px 10px 70px}
  .bar{gap:6px}
  .bar .btn{padding:7px 10px;font-size:13px}
  #tuNgay{max-width:140px}
  .legend{display:none}
  #tlThang{min-width:0;font-size:13px}
  .tl-r{padding:0 6px;font-size:12.5px}
  .tl-r small{font-size:10.5px}
  .tl-h{font-size:11px}.tl-h b{font-size:12.5px}
  .tl-h.we::after{content:"T6-T7";font-size:8.5px}
  .bk{padding:2px 6px;font-size:11px}.bk b{font-size:11.5px}
  .row2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi b{font-size:16px}
  .cot{height:130px;gap:3px}.cot-v{font-size:8.5px}.cot-t{font-size:11px}
  table.so{min-width:0}
  table.so .c-ngay,table.so .c-ma{display:none}
  table.so th,table.so td{padding:8px 8px;font-size:12.5px}
  .m-only{display:inline-block;margin-left:4px}
  .loc{max-width:none}
  .day-h{font-size:15px}
  .cards{grid-template-columns:1fr}
  .dr{padding:16px 14px 30px}
  .mbox .mh{padding:10px}
}
.menu-w{position:relative}
.menu-b{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:45;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.16);width:min(300px,86vw);padding:6px;display:flex;flex-direction:column}
.menu-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:700}
.menu button,.menu a{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--fg);font-weight:600;font-size:14px}
.menu a{flex-direction:row;flex-wrap:wrap;column-gap:8px}.menu a small{flex-basis:100%;padding-left:26px;font-weight:400}
.menu button:hover,.menu a:hover{background:var(--soft)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tagf{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:800;letter-spacing:.04em}
.tagf small{font-weight:600;opacity:.75;margin-left:2px}
.tagf.Book{border-color:#9ec0ee;color:#1f58a8;background:#eef4fd}.tagf.Keep{border-color:#f3cf8f;color:#8a5a00;background:#fff6e4}
.tagf.Done{border-color:#c4c8cc;color:#33373b;background:#f1f2f3}.tagf.Huy{border-color:#e2e2e2;color:var(--muted);background:#fafafa}
.tagf.tat{opacity:.4;text-decoration:line-through}
.tagf.on{box-shadow:0 0 0 2px var(--fg) inset}
.bk .tg,.tg{display:inline-block;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.05em;border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:1px;background:rgba(255,255,255,.25)}
.bk.Keep .tg{background:#f3b54a;color:#4a2c00}
.tg.Book{background:#e3edfb;color:#1f58a8}.tg.Keep{background:#fff0d1;color:#8a5a00}.tg.Done{background:#e6e7e9;color:#33373b}.tg.Huy{background:#eee;color:var(--muted)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg2 button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13px}
.seg2 button.on{background:var(--fg);color:#fff}
.ds-ngay{font-weight:700;margin:16px 0 6px;font-size:14px}
.ds-d{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.35fr) minmax(0,1fr) 210px;gap:4px 14px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.ds-d:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.ds-d.huy{opacity:.55}
.ds-c1{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}.ds-c1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ds-c2,.ds-c3{font-size:13px;min-width:0;overflow-wrap:anywhere;justify-self:start;text-align:left}
