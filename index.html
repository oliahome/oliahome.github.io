<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Olia Home · Đặt phòng Đà Lạt</title><link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f33f/72.png">
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Sacramento&family=Ms+Madi&display=swap">
  <style>
/* Bố cục kiểu Airbnb: thanh tìm kiếm dạng viên thuốc, lưới thẻ phòng, trang chi tiết 2 cột + khung đặt phòng dính.
   Màu nhấn lấy từ vòng tròn nắng trong logo Olia, nền giấy be như tờ giới thiệu phòng. */
:root{
  --bg:#ffffff; --paper:#f7f2ea; --fg:#222222; --muted:#6a6a6a; --line:#e6e1d8; --soft:#f4f1ec;
  --sun:#e9a23b; --sun2:#d9772b; --leaf:#4f6b3e; --bad:#c13515; --ok:#2f7d4f;
  --r:14px; --shadow:0 6px 20px rgba(0,0,0,.12);
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --script:"Fraunces",Georgia,serif; --hand:"Sacramento","Brush Script MT",cursive; --viet:"Ms Madi","Brush Script MT",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* thanh trên */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;height:76px;display:flex;align-items:center;gap:16px;justify-content:space-between;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-img{width:48px;height:48px;border-radius:50%;object-fit:cover;mix-blend-mode:multiply;flex:none}
img.avatar{object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.logo-t{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;color:#3b2a1a;line-height:1}
.logo-t b{font:400 34px/1 var(--hand);letter-spacing:.01em}
.logo-t small{font:400 19px/1 var(--hand);color:#8a6a45}
.pill{display:flex;flex:none;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);padding:6px 6px 6px 8px;gap:0;min-width:0}
.pill:hover{box-shadow:var(--shadow)}
.pill-seg{padding:0 14px;white-space:nowrap;font-size:14px}
.pill-seg+.pill-seg{border-left:1px solid var(--line);color:var(--muted)}
.pill-go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--sun),var(--sun2));flex:none}
.top-r{display:flex;gap:8px;align-items:center;min-width:0;flex:0 1 auto}
.ghost{border:0;background:none;padding:10px 12px;border-radius:99px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.ghost:hover{background:var(--soft)}
@media (max-width:1320px){.top-r .mxh-i{display:none}}
@media (max-width:760px){
  .top-in{height:68px}
  .logo-t,.top-r{display:none}
  .pill{flex:1 1 auto;justify-content:space-between;min-width:0}
  .pill-seg{padding:0 8px}
}

/* chung */
.loading{min-height:60vh;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sun2);animation:q 0.9s linear infinite}
@keyframes q{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.btn{border:0;border-radius:10px;padding:14px 22px;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--sun2),var(--sun));width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--fg)}
.btn.line{background:var(--bg);color:var(--fg);border:1px solid var(--fg)}
.muted{color:var(--muted)}
.sm{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.u{text-decoration:underline;background:none;border:0;padding:0;font-weight:600}
.hr{height:1px;background:var(--line);margin:28px 0}
.star{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.star svg{width:12px;height:12px}

/* phần đầu trang danh sách */
.hero{padding-block:28px 6px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(26px,3.4vw,38px);font-weight:700;letter-spacing:-.02em}
.hero h1 em{font:italic 500 1.05em var(--script);color:var(--sun2)}
.hero p{color:var(--muted);margin-top:12px;max-width:58ch}
.hero-ph{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:260px;border-radius:var(--r);overflow:hidden}
.hero-ph div{background:var(--paper) center/cover no-repeat}
.hero-ph div:first-child{grid-row:span 2}
.hero-ph img,.mosaic button img,.sum-h .th img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic button{overflow:hidden}
.sum-h .th{overflow:hidden}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
a.fact{text-decoration:none}
a.fact:hover{text-decoration:underline}
.fact{background:var(--paper);border-radius:99px;padding:6px 12px;font-size:13.5px}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:18px}.hero-ph{height:200px;order:-1}}

.chips{display:flex;gap:10px;overflow-x:auto;padding-block:18px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 16px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.result{font-weight:600;padding-block:6px 14px}

/* lưới thẻ phòng */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:36px 24px;padding-bottom:48px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer}
.card.off{opacity:.55}
.car{position:relative;aspect-ratio:20/19;border-radius:var(--r);overflow:hidden;background:var(--paper)}
.car-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.car-track img{flex:0 0 100%;height:100%;object-fit:cover;scroll-snap-align:start}
.car-empty{height:100%;display:grid;place-items:center;font-size:60px}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.2);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.car-nav.l{left:10px}.car-nav.r{right:10px}
.car:hover .car-nav{opacity:1}
@media (hover:none){.car-nav{display:none}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}
.dots i.on{background:#fff}
.tag{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tag.bad{color:var(--bad)}
.c-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.c-name{font-weight:600}
.c-sub{color:var(--muted);font-size:14px;line-height:1.4}
.c-price{margin-top:2px}
.c-price b{font-weight:600}

/* trang chi tiết */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px}
.d-head{padding-top:14px;display:flex;flex-direction:column;gap:6px}
.d-head h1{font-size:clamp(22px,3vw,28px);font-weight:600}
.mosaic{margin-top:18px;display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px;gap:8px;border-radius:var(--r);overflow:hidden;position:relative}
.mosaic button{border:0;padding:0;background:var(--paper) center/cover no-repeat}
.mosaic button:first-child{grid-row:span 2}
.mosaic button:hover{filter:brightness(.92)}
.mosaic .all{position:absolute;right:16px;bottom:16px;background:#fff;border:1px solid var(--fg);border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600}
@media (max-width:760px){
  .mosaic{grid-template-columns:1fr;grid-template-rows:260px;margin-left:calc(-1*max(20px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(20px,env(safe-area-inset-right,0px)));border-radius:0}
  .mosaic button:not(:first-child){display:none}
  .mosaic button:first-child{grid-row:auto}
}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:72px;margin-top:30px;padding-bottom:60px}
@media (max-width:960px){.d-body{grid-template-columns:1fr;gap:0}}
.d-main{min-width:0}
.d-sum h2{font-size:21px;font-weight:600}
.feat{display:flex;flex-direction:column;gap:20px}
.feat div{display:flex;gap:16px;align-items:flex-start}
.feat .ic{font-size:22px;width:28px;text-align:center;flex:none;line-height:1.2}
.feat b{display:block;font-weight:600}
.amen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
@media (max-width:560px){.amen{grid-template-columns:1fr}}
.amen div{display:flex;gap:14px;align-items:center}
.amen .ic{font-size:20px;width:26px;text-align:center;flex:none}
.sec-t{font-size:21px;font-weight:600;margin-bottom:18px}
.desc{white-space:pre-line;max-width:68ch}
.host{display:flex;gap:14px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 40%,#f6cf7a,var(--sun) 70%,var(--sun2));display:grid;place-items:center;font:italic 500 18px var(--script);color:#fff}

/* khung đặt phòng */
.book{position:sticky;top:100px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:16px}
.book-p{font-size:22px;font-weight:600}
.book-p span{font-size:16px;font-weight:400}
.bx{border:1px solid #b0b0b0;border-radius:10px;overflow:hidden}
.bx-row{display:grid;grid-template-columns:1fr 1fr}
.bx-cell{padding:10px 12px;text-align:left;border:0;background:var(--bg);min-width:0}
.bx-row .bx-cell+.bx-cell{border-left:1px solid #b0b0b0}
.bx-cell+.bx-row,.bx-row+.bx-cell{border-top:1px solid #b0b0b0}
.bx-cell small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bx-cell span{font-size:14px}
.bx-cell.wide{width:100%}
.lines{display:flex;flex-direction:column;gap:12px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .tot{border-top:1px solid var(--line);padding-top:14px;font-weight:600}
.note{text-align:center;font-size:13.5px;color:var(--muted)}
.mbar{display:none}
@media (max-width:960px){
  .book.side{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);align-items:center;justify-content:space-between;gap:12px;
    padding:12px max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .mbar .btn{width:auto;padding:12px 22px}
  .has-mbar{padding-bottom:90px}
}

/* lịch */
.cal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
@media (max-width:760px){.cal{grid-template-columns:1fr}}
.mon h4{text-align:center;margin:0 0 12px;font-size:15px}
.mon-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.mon-g .dw{font-size:12px;color:var(--muted);padding:6px 0}
.dd{aspect-ratio:1;border:0;background:none;padding:0;position:relative;font-size:14px;font-weight:500}
.dd span{display:grid;place-items:center;width:100%;height:100%;border:1.5px solid transparent}
.dd:not(:disabled):hover span{border-color:var(--fg)}
.dd:disabled{color:#c5c5c5;cursor:default}
.dd.ban:disabled span{text-decoration:line-through}
.dd.in-r{background:var(--soft)}
.dd.s,.dd.e{background:var(--soft)}
.dd.s{border-radius:50% 0 0 50%}.dd.e{border-radius:0 50% 50% 0}.dd.s.e{border-radius:50%}
.dd.s span,.dd.e span{background:var(--fg);color:var(--bg)}
.dd.today span{text-decoration:underline}
/* màu thông minh theo độ trống */
:root{--m-tot:#e3f1e6;--m-vua:#fbefcf;--m-it:#f9d9c6;--m-kin:#efedea;--m-cao:#fde4c0}
.dd.m-tot span{background:var(--m-tot)}.dd.m-vua span{background:var(--m-vua)}.dd.m-it span{background:var(--m-it)}
.dd.m-cao span{background:var(--m-cao)}.dd.m-kin span{background:var(--m-kin)}
.dd span{border-radius:10px}
.dd.in-r span{background:transparent}
.dd.s span,.dd.e span{background:var(--fg);color:var(--bg)}
.dd:disabled.m-kin span{color:#b9b4ad}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:4px;display:inline-block}
.lg.tot{background:var(--m-tot)}.lg.vua{background:var(--m-vua)}.lg.it{background:var(--m-it)}.lg.kin{background:var(--m-kin)}.lg.cao{background:var(--m-cao)}
.cal-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cal-top .cal-nav{margin:0;gap:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{border:0;background:none;border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cal.quy{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.cal.nam{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 22px}
.cal.quy .dd,.cal.nam .dd{font-size:12px}
.cal.nam .dd{font-size:11px}
.cal.nam .mon h4,.cal.quy .mon h4{font-size:13.5px;margin-bottom:6px}
.cal.nam .mon-g,.cal.quy .mon-g{row-gap:2px;column-gap:2px}
.cal.nam .dd span,.cal.quy .dd span{border-radius:6px;border-width:1px}
@media (max-width:960px){.cal.nam{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.cal.quy{grid-template-columns:1fr}.cal.nam{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
.dd small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;color:var(--muted);font-weight:400}
.dd.s small,.dd.e small{display:none}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.rbtn:disabled{opacity:.3}

/* bảng nổi (lịch, số khách) */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.sheet-box{background:var(--bg);border-radius:20px;width:min(980px,100%);max-height:calc(100% - 20px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-h h3{font-size:18px}
.sheet-f{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.sheet-f .btn{width:auto}
@media (max-width:760px){
  .sheet{place-items:end stretch;padding:0}
  .sheet-box{border-radius:20px 20px 0 0;max-height:92%;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
.cnt{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cnt:last-child{border:0}
.cnt-c{display:flex;align-items:center;gap:14px}
.cnt-c b{min-width:20px;text-align:center}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-size:18px;line-height:1}

/* thư viện ảnh */
.gallery{position:fixed;inset:0;z-index:60;background:#111;color:#fff;display:flex;flex-direction:column}
.g-top{display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-left,0px));padding-top:calc(14px + env(safe-area-inset-top,0px))}
.g-top button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:8px 14px}
.g-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.g-track::-webkit-scrollbar{display:none}
.g-track div{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:8px}
.g-track img{max-height:calc(100vh - 120px);object-fit:contain;border-radius:6px}

/* xác nhận & hoàn tất */
.co{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:64px;padding-block:24px 60px}
@media (max-width:960px){.co{grid-template-columns:1fr;gap:28px}}
.co h1{font-size:28px;font-weight:600;display:flex;align-items:center;gap:14px}
.co-sec{display:flex;flex-direction:column;gap:16px}
.co-sec h2{font-size:20px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kv b{display:block}
.f{display:flex;flex-direction:column;border:1px solid #b0b0b0;border-radius:10px;padding:8px 12px}
.f:focus-within{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.f label{font-size:12px;color:var(--muted)}
.f input,.f textarea{border:0;outline:0;font:inherit;font-size:16px;padding:2px 0;background:none;color:var(--fg);resize:vertical}
.f.err{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.hint{font-size:13px;color:var(--bad)}
.trap{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.sum{border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:100px}
.sum-h{display:flex;gap:14px}
.sum-h .th{width:110px;height:96px;border-radius:10px;flex:none;background:var(--paper) center/cover no-repeat}
.policy{background:var(--paper);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.err-box{background:#fdeceb;color:var(--bad);border-radius:10px;padding:12px 14px;font-size:14px}
.done{max-width:640px;margin:0 auto;padding-block:36px 64px;display:flex;flex-direction:column;gap:22px}
.done-h{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.done-h .ok{width:64px;height:64px;border-radius:50%;background:#e7f3ec;color:var(--ok);display:grid;place-items:center;font-size:30px}
.done-h h1{font-size:26px}
.code{font:600 26px ui-monospace,Menlo,monospace;letter-spacing:.04em}
.qr{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center}
.qr img{width:200px;border-radius:8px}
@media (max-width:560px){.qr{grid-template-columns:1fr;justify-items:center;text-align:center}}
.qr-k{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 8px;font-size:12.5px;margin-left:6px}
.paid{display:flex;gap:16px;align-items:center;background:#e7f3ec;border-radius:var(--r);padding:20px}

/* ---------- lịch: xem theo Tháng / Quý / 12 tháng, ngày tô màu theo độ trống ---------- */
var LICH = { thang: null, che: "thang" };
var CHE = [["thang", "Tháng"], ["quy", "Quý"], ["nam", "12 tháng"]];
function soThangHien() { return LICH.che === "nam" ? 12 : LICH.che === "quy" ? 3 : (window.innerWidth > 760 ? 2 : 1); }
function giaNen(id) {   // giá thấp nhất trong năm = giá thường, để nhận ra ngày cao điểm
  if (!giaNen.c) giaNen.c = {};

/* mức màu 1 ngày: khi xem chung = số phòng còn trống; khi xem 1 phòng = trống/cao điểm */
function mucNgay(key, phongId) {
  if (phongId) {
    var g = giaDem(phongId, key);

    return g > giaNen(phongId) * 1.05 ? "cao" : "tot";

  return con === 0 ? "kin" : con === 1 ? "it" : con <= 3 ? "vua" : "tot";

    }).join("") + '</div><div class="cal-nav"><button class="rbtn" data-act="mon" data-v="-1" aria-label="Lùi"' +

var TT = { het: 0, daTra: false, soTien: 0, dem: null, hoi: null, batDau: 0, dangHoi: false };
function batDauThanhToan() {
  dungThanhToan();

  TT.daTra = false; TT.soTien = 0; TT.batDau = Date.now();
  TT.het = Date.now() + (d.phutQR || 5) * 60000;

  if (d.tuDong) TT.hoi = setInterval(hoiThanhToan, 5000);
}
function dungThanhToan() { clearInterval(TT.dem); clearInterval(TT.hoi); TT.dem = TT.hoi = null; }
function hoiThanhToan(tay) {
  if (TT.daTra || TT.dangHoi || S.view !== "done") return;
  if (!tay && Date.now() > TT.het && (Date.now() - TT.batDau) % 15000 > 5000) return;   // hết hạn QR: hỏi thưa hơn
  if (Date.now() - TT.batDau > 3 * 3600e3) { dungThanhToan(); return; }
  TT.dangHoi = true;
  goi("kiemTraThanhToan", [S.don.maCK, S.don.khoa], function(r) {
    TT.dangHoi = false;
    if (r.daTra) { TT.daTra = true; TT.soTien = r.soTien; TT.trung = !!r.trung; dungThanhToan(); veXong(); }
    else if (tay) toast(r.tuDong ? "Chưa thấy tiền về, hệ thống vẫn đang chờ…" : "Olia sẽ kiểm tra và xác nhận cho bạn sớm nhất");
  }, function(e) { TT.dangHoi = false; if (tay) toast(e); });
}
function veDongHo() {
  var el = $("#dongHo");

/* ảnh trong chat: ảnh đã gửi từ máy này giữ bản nhỏ trong trình duyệt để xem lại */
function anhNho_() { try { return JSON.parse(localStorage.getItem("olia_chat_anh") || "{}"); } catch (e) { return {}; } }
function ndChatKhach(m) {
  if (m.tam) return '<img class="chat-img" src="' + m.tam + '" alt="Ảnh">';
  if (m.anh) return '<img class="chat-img" src="' + m.anh + '" alt="Ảnh Olia gửi">';
  var nho = anhNho_();
  return esc(m.nd).replace(/\[\[anh:([\w-]+)\]\]/g, function(_, id) { return nho[id] ? '<img class="chat-img" src="' + nho[id] + '" alt="Ảnh đã gửi">' : "🖼 Ảnh"; })
    .replace(/\[\[(anhurl|tep):[^\]]*\]\]/g, "📎 Tệp").replace(/\n/g, "<br>");
}
function thuNho_(file, canh, cl) {   // đọc ảnh -> JPEG cạnh dài tối đa `canh` px
  return new Promise(function(ok, loi) {
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function() {
      var k = Math.min(1, canh / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      var g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(u); ok(cv.toDataURL("image/jpeg", cl));
    };
    im.onerror = function() { URL.revokeObjectURL(u); loi(); };
    im.src = u;
  });
}
function guiAnhChat(files) {
  [].slice.call(files || [], 0, 5).filter(function(f) { return /^image\//.test(f.type); }).forEach(function(f) {
    if (f.size > 25e6) { toast("Ảnh quá lớn (tối đa 25 MB)."); return; }
    Promise.all([thuNho_(f, 1280, 0.8), thuNho_(f, 320, 0.7)]).then(function(r) {
      var m = { t: Date.now(), ai: "khach", nd: "", tam: r[1], dangGui: true };
      CHAT.ds.push(m); CHAT.cho = (CHAT.cho || 0) + 1; veChat();

        CHAT.cho--;
        if (!kq.ok) { CHAT.ds.splice(CHAT.ds.indexOf(m), 1); veChat(); toast(kq.loi); return; }
        var nho = anhNho_(), ks = Object.keys(nho); nho[kq.data.id] = r[1];
        if (ks.length >= 20) delete nho[ks[0]];
        try { localStorage.setItem("olia_chat_anh", JSON.stringify(nho)); } catch (e) {}
        taiChat();
      }).withFailureHandler(function() { CHAT.cho--; CHAT.ds.splice(CHAT.ds.indexOf(m), 1); veChat(); toast("Chưa gửi được ảnh, thử lại nhé."); })
        .guiAnhChat({ ma: CHAT.ma, ten: CHAT.ten, sdt: CHAT.sdt, anh: r[0] });
    }, function() { toast("Không đọc được ảnh này."); });
  });
}

  var ta = $("#chND"), nd = ta.value.trim(); if (!nd) return;
  CHAT.ds.push({ t: Date.now(), ai: "khach", nd: nd }); ta.value = ""; veChat();
  google.script.run.withSuccessHandler(function(r) {
    if (!r.ok) { toast(r.loi); return; } taiChat();
  }).withFailureHandler(function() { toast("Chưa gửi được, thử lại nhé."); }).guiChat({ ma: CHAT.ma, ten: CHAT.ten, sdt: CHAT.sdt, nd: nd, web: ($("#chatGui [name=web]") || {}).value });
}
function taiChat(im) {

  }).layChat(CHAT.ma);
}

    '<button class="btn dark" type="submit">Vào</button></form><label class="sm muted" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="dnNho" checked> Ghi nhớ trên máy này</label><div id="dnLoi"></div>');
  $("#fDN").addEventListener("submit", function(e) {

document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var a = el.dataset.act, v = el.dataset.v;
  if (a === "slide") {
    e.stopPropagation();
    var tr = el.parentNode.querySelector(".car-track");
    tr.scrollBy({ left: Number(v) * tr.clientWidth, behavior: "smooth" });
    return;
  }
  if (el.tagName === "A" && a !== "home") return;
  e.preventDefault();
  if (a === "home") { $("#sheet").hidden = true; document.body.style.overflow = ""; chuyen("list"); }
  else if (a === "loc") { S.loc = v; ve(); }
  else if (a === "room") { LICH.thang = null; chuyen("room", v); }
  else if (a === "backRoom") chuyen("room");
  else if (a === "openSearch" || a === "openCal") moLich();
  else if (a === "openGuest") moKhach();
  else if (a === "close") dongSheet();
  else if (a === "mon") {
    var d = dk(LICH.thang + "-01"); d.setMonth(d.getMonth() + Number(v) * soThangHien()); LICH.thang = kd(d).slice(0, 7);
    if (!$("#sheet").hidden) veLichPop(); else veLich($("#calInline"), S.phong);
  }
  else if (a === "che") {
    LICH.che = v;
    if (v !== "thang") { var q = dk((S.vao || S.d.homNay).slice(0, 7) + "-01"); if (v === "quy") q.setMonth(q.getMonth() - q.getMonth() % 3); LICH.thang = kd(q).slice(0, 7); }
    if (!$("#sheet").hidden) veLichPop(); else veLich($("#calInline"), S.phong);
  }
  else if (a === "day") {
    chonNgay(v);
    if (!$("#sheet").hidden) { veLichPop(); capNhatPill(); }
    else ve();
    if (S.vao && S.ra && !$("#sheet").hidden && S.view !== "list") setTimeout(dongSheet, 350);
  }
  else if (a === "clearDate") { S.vao = ""; S.ra = ""; if (!$("#sheet").hidden) { veLichPop(); capNhatPill(); } else ve(); }
  else if (a === "khach") {
    var p = v.split(","), k = p[0], n = Number(p[1]);
    if (k === "nl") S.nl = Math.min(8, Math.max(1, S.nl + n));
    else if (k === "te") S.te = Math.min(6, Math.max(0, S.te + n));
    else S.eb = Math.min(S.d.cd.emBeToiDa || 2, Math.max(0, S.eb + n));
    $("#nl").textContent = S.nl; $("#te").textContent = S.te; $("#eb").textContent = S.eb; capNhatPill();
  }
  else if (a === "checkout") {
    var ph = phongTheoId(S.phong);
    if (!(S.vao && S.ra)) { moLich(); return; }
    if (!trong(ph, S.vao, S.ra) || !vuaKhach(ph)) { toast("Phòng không phù hợp ngày hoặc số khách đã chọn"); return; }
    chuyen("checkout");
  }
  else if (a === "qrLai") { TT.het = Date.now() + (S.don.phutQR || 5) * 60000; if (!TT.dem) TT.dem = setInterval(veDongHo, 1000); veXong(); }
  else if (a === "daChuyen") hoiThanhToan(true);
  else if (a === "lang") doiNgonNgu();
  else if (a === "dangNhap") moDangNhap();
  else if (a === "traCuu") { TC.kq = null; TC.loi = ""; if (v) TC.q = v; chuyen("tracuu"); if (v) timTC(v); }
  else if (a === "gal") moAnh(Number(v));
  else if (a === "chinhSach") moChinhSach();
  else if (a === "boMa") { S.maGiam = null; veXacNhan(); }
  else if (a === "ytPhat") { var f = document.createElement("iframe"); f.src = "https://www.youtube-nocookie.com/embed/" + v + "?autoplay=1&rel=0&modestbranding=1&playsinline=1";
    f.title = "Olia Home"; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true; f.className = "yt-f"; el.replaceWith(f); }
  else if (a === "kgXem") moAnh(Number(v) || 0, anhTron(), "Không gian Olia");
  else if (a === "kgMo") { S.kgMo = !S.kgMo; var o2 = $("#kg"); if (o2) { var t2 = document.createElement("div"); t2.innerHTML = khongGian(); o2.replaceWith(t2.firstChild); } }
  else if (a === "chatMo") { if ($("#chatP").hidden) moChat(); else dongChat(); }
  else if (a === "chatDong") dongChat();
  else if (a === "kgAnh") moAnh(Number(v) || 0, anhKG(), "Không gian Olia");
  else if (a === "kgKhu") { S.kgKhu = v || ""; var o = $("#kg"); if (o) { var t = document.createElement("div"); t.innerHTML = khongGian(); o.replaceWith(t.firstChild); } }
  else if (a === "galClose") { $("#gallery").hidden = true; document.body.style.overflow = ""; }
  else if (a === "copy") {
    var xong = function() { toast("Đã chép " + v); };
    try { navigator.clipboard.writeText(v).then(xong, function() { toast(v); }); } catch (er) { toast(v); }
  }
});
$("#sheet").addEventListener("click", function(e) { if (e.target.id === "sheet") dongSheet(); });

  else if (!$("#sheet").hidden) dongSheet();
});
